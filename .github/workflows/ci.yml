name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Pytest
        run: python -m pytest -v

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Audit production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements-prod.txt
          pip-audit -r requirements-prod.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          chmod +x gitleaks

      - name: Scan repository for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
          else
            LOG_OPTS="origin/${REF_NAME}"
          fi
          ./gitleaks detect --source . --config .gitleaks.toml --log-opts="$LOG_OPTS" --verbose --redact --no-banner

  owasp-sast:
    name: owasp-sast
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.122.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep OWASP gate
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/python \
            --config p/secrets \
            --config security/semgrep/ \
            --error \
            --metrics off

  all-checks:
    name: ci
    needs: [lint-test, security-audit, secret-scan, owasp-sast]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require lint, test, dependency audit, secret scan, and OWASP SAST
        run: |
          test "${{ needs.lint-test.result }}" = "success"
          test "${{ needs.security-audit.result }}" = "success"
          test "${{ needs.secret-scan.result }}" = "success"
          test "${{ needs.owasp-sast.result }}" = "success"

  merge-on-green:
    name: merge-on-green
    needs: [all-checks]
    if: github.event_name == 'pull_request' && needs.all-checks.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Auto-merge Dependabot or automerge-labeled PR
        env:
          # MAPSNATCH_GITHUB_PAT (falls back to GITHUB_TOKEN): GITHUB_TOKEN-authored
          # pushes don't trigger downstream `push` workflows (GitHub anti-loop), so a
          # bare-token merge here would never fire docs.yml's Pages rebuild. Same PAT
          # as mapsnatch-web; see that repo's ci.yml for the full reasoning.
          GH_TOKEN: ${{ secrets.MAPSNATCH_GITHUB_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTHOR="${{ github.event.pull_request.user.login }}"
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          if [[ "$AUTHOR" == *dependabot* ]] || echo "$LABELS" | grep -q automerge; then
            gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --squash --delete-branch
          else
            echo "no auto-merge"
          fi
